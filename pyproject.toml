[project]
name = "lead-list-tools"
version = "0.1.0"
description = "Scrape an event programme, match the people in it against CRM exports, write lead lists. Runs on generated mock data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.scripts]
leadlist = "leadlist.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
