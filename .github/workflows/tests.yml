name: tests

on:
  push:
  pull_request:

# The job reads the code and runs it. It needs nothing else from the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Actions are pinned to exact commits, so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          python-version: ${{ matrix.python-version }}
      # --locked: fail if uv.lock does not match pyproject.toml, so that CI runs what was reviewed.
      - run: uv sync --locked
      - run: uv run leadlist filter --self-test
      - run: uv run pytest -q
